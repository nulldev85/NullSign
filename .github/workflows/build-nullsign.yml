name: Build NullSign IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # iPhone Duo's inner display only runs an app full screen when it is built
    # with the iOS 27.1 SDK; older SDKs get a letterboxed window. GitHub's
    # Xcode images are per major version, so this one carries Xcode 27.x.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Apply pinned Zsign fixes
        run: python3 Tools/prepare-zsign.py

      - name: Select OpenSSL 3 for native regression tests
        run: |
          brew install openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Test native resource sealing and signing failure handling
        run: |
          python3 Tools/test-zsign-patches.py
          python3 Tools/test-zsign-resources.py
          python3 Tools/test-certificate-import.py
          python3 Tools/test-app-import.py
          xcrun swiftc Feather/Backend/Storage/Storage+Shared.swift Tools/Fixtures/LibraryDeletionTests.swift -o "$RUNNER_TEMP/test-library-deletion"
          "$RUNNER_TEMP/test-library-deletion"
          python3 Tools/test-zsign-handler.py
          python3 Tools/test-one-tap-install.py
          python3 Tools/test-install-observation.py
          python3 Tools/test-ar-decompression.py
          xcrun swiftc Feather/Utilities/AnyCodable.swift Feather/Utilities/CertificateReader/Models/CertificateModel.swift Tools/test-certificate-profile.swift -o "$RUNNER_TEMP/test-certificate-profile"
          "$RUNNER_TEMP/test-certificate-profile"

      - name: Set up typography check runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify SF Rounded coverage
        run: node Tools/check-typography.mjs --self-test

      - name: Verify icon styling
        run: node Tools/check-icon-style.mjs

      - name: Verify shared Settings palette
        run: node Tools/check-color-scheme.mjs

      - name: Verify tvOS icon selection
        run: |
          node Tools/check-tvos-icon-policy.mjs
          xcrun swiftc Feather/Utilities/TVIconSelection.swift Tools/test-tvos-icon-selection.swift -o "$RUNNER_TEMP/test-tvos-icon-selection"
          "$RUNNER_TEMP/test-tvos-icon-selection"

      - name: Verify app icon assets
        run: node Tools/check-app-icon.mjs

      - name: Build unsigned NullSign IPA
        run: |
          cmp -s Feather/Resources/NullSignBlue.icon/Assets/nullsign.png Feather/Resources/Assets.xcassets/NullSignBlue.appiconset/nullsign.png
          make iphoneos

      - name: Verify IPA structure
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          unzip -q packages/NullSign-unsigned.ipa -d "$workdir"
          plist_count="$(find "$workdir/Payload" -mindepth 2 -maxdepth 2 -type f -path '*.app/Info.plist' | wc -l | tr -d ' ')"
          test "$plist_count" -eq 1
          plist_path="$(find "$workdir/Payload" -mindepth 2 -maxdepth 2 -type f -path '*.app/Info.plist')"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path"

          expected_version="$(sed -nE 's/^NULLSIGN_MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' NullSign.xcconfig)"
          expected_build="$(sed -nE 's/^NULLSIGN_BUILD_NUMBER[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' NullSign.xcconfig)"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist_path")"
          actual_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist_path")"

          test -n "$expected_version"
          test -n "$expected_build"
          test "$actual_version" = "$expected_version"
          test "$actual_build" = "$expected_build"

          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$plist_path")"
          test "$icon_name" = "NullSignBlue"
          node Tools/check-packaged-icon.mjs "$workdir/Payload/NullSign.app"
          python3 Tools/test-ar-decompression.py --ipa packages/NullSign-unsigned.ipa
          echo "Verified NullSign $actual_version ($actual_build)"

      - name: Store manual IPA in draft test release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: test-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="packages/NullSign-unsigned.ipa"
          test -s "$ipa"
          (
            cd packages
            shasum -a 256 NullSign-unsigned.ipa > NullSign-unsigned.ipa.sha256
          )
          version="$(sed -nE 's/^NULLSIGN_MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' NullSign.xcconfig)"
          build="$(sed -nE 's/^NULLSIGN_BUILD_NUMBER[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' NullSign.xcconfig)"
          test -n "$version"
          test -n "$build"
          {
            echo "Unpublished manual test IPA. Merge remains a separate decision."
            echo
            echo "Version: $version ($build)"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/test-release-notes.md"
          gh release create "$TEST_TAG" "$ipa" packages/NullSign-unsigned.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "NullSign $version ($build) — manual test $GITHUB_RUN_ID" \
            --notes-file "$RUNNER_TEMP/test-release-notes.md" \
            --target "$GITHUB_SHA" \
            --draft \
            --latest=false
          test "$(gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          release_url="$(gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          test -n "$release_url"
          {
            echo "### NullSign $version ($build) test IPA"
            echo
            printf '[Download the test IPA](%s)\n' "$release_url"
            echo
            echo 'Open the draft release above and download `NullSign-unsigned.ipa`.'
            echo 'The draft is visible to repository maintainers and is not a public release.'
            echo 'A SHA-256 checksum is attached alongside the IPA.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public source release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: source-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="packages/NullSign-unsigned.ipa"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          unzip -q "$ipa" -d "$workdir"
          plist="$workdir/Payload/NullSign.app/Info.plist"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          minimum_os=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")
          test "$bundle_id" = "com.elmat.NullSign"
          {
            echo "Source-App: NullSign"
            echo "Source-Bundle-Identifier: $bundle_id"
            echo "Source-Version: $version"
            echo "Source-Build-Version: $build"
            echo "Source-Minimum-OS-Version: $minimum_os"
            echo "Source-Branch: main"
            echo "Source-SHA: $GITHUB_SHA"
          } > "$RUNNER_TEMP/source-release-notes.md"
          gh release create "$SOURCE_TAG" "$ipa#NullSign.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NullSign $version ($build)" \
            --notes-file "$RUNNER_TEMP/source-release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest=false
