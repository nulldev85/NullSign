name: Build NullSign IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # iPhone Duo's inner display runs an app full screen only when it is built
    # with the iOS 27.1 SDK. GitHub's Xcode images are per major version.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      # NullSign 2.0 is built from NullSign.xcodeproj; the
      # app it produces is NullSign: com.elmat.NullSign, named NullSign.
      - name: Build unsigned NullSign IPA
        shell: bash
        run: |
          set -euo pipefail
          make
          cp packages/NullSign.ipa packages/NullSign-unsigned.ipa

      - name: Verify IPA structure
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          unzip -q packages/NullSign-unsigned.ipa -d "$workdir"
          plist_count="$(find "$workdir/Payload" -mindepth 2 -maxdepth 2 -type f -path '*.app/Info.plist' | wc -l | tr -d ' ')"
          test "$plist_count" -eq 1
          plist="$(find "$workdir/Payload" -mindepth 2 -maxdepth 2 -type f -path '*.app/Info.plist')"
          app_dir="$(dirname "$plist")"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"

          # Installs over NullSign 1.x, and updates compare numeric builds.
          test "$bundle_id" = "com.elmat.NullSign"
          test "$name" = "NullSign"
          # "Open in" on files shows the bundle name, not the display name.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "NullSign"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$build" =~ ^[0-9]+$ ]]

          # Every extension must sit under NullSign's identifier.
          if [ -d "$app_dir/PlugIns" ]; then
            for appex in "$app_dir"/PlugIns/*.appex; do
              ext_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")"
              echo "Extension: $ext_id"
              [[ "$ext_id" == com.elmat.NullSign.* ]]
            done
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Verified NullSign $version ($build), $bundle_id"

      - name: Store manual IPA in draft test release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: test-${{ github.run_id }}-${{ github.run_attempt }}
          VERSION: ${{ steps.verify.outputs.version }}
          BUILD: ${{ steps.verify.outputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="packages/NullSign-unsigned.ipa"
          test -s "$ipa"
          (
            cd packages
            shasum -a 256 NullSign-unsigned.ipa > NullSign-unsigned.ipa.sha256
          )
          {
            echo "Unpublished manual test IPA. Merge remains a separate decision."
            echo
            echo "Version: $VERSION ($BUILD)"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/test-release-notes.md"
          gh release create "$TEST_TAG" "$ipa" packages/NullSign-unsigned.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "NullSign $VERSION ($BUILD) — manual test $GITHUB_RUN_ID" \
            --notes-file "$RUNNER_TEMP/test-release-notes.md" \
            --target "$GITHUB_SHA" \
            --draft \
            --latest=false
          test "$(gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          release_url="$(gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          {
            echo "### NullSign $VERSION ($BUILD) test IPA"
            echo
            printf '[Download the test IPA](%s)\n' "$release_url"
            echo
            echo 'Open the draft release above and download `NullSign-unsigned.ipa`.'
            echo 'The draft is visible to repository maintainers and is not a public release.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public source release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: source-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="packages/NullSign-unsigned.ipa"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          unzip -q "$ipa" -d "$workdir"
          plist="$(find "$workdir/Payload" -mindepth 2 -maxdepth 2 -type f -path '*.app/Info.plist')"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          minimum_os=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")
          test "$bundle_id" = "com.elmat.NullSign"
          {
            echo "Source-App: NullSign"
            echo "Source-Bundle-Identifier: $bundle_id"
            echo "Source-Version: $version"
            echo "Source-Build-Version: $build"
            echo "Source-Minimum-OS-Version: $minimum_os"
            echo "Source-Branch: main"
            echo "Source-SHA: $GITHUB_SHA"
          } > "$RUNNER_TEMP/source-release-notes.md"
          gh release create "$SOURCE_TAG" "$ipa#NullSign.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NullSign $version ($build)" \
            --notes-file "$RUNNER_TEMP/source-release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest=false
