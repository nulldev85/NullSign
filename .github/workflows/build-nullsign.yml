name: Build NullSign IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned NullSign IPA
        run: make iphoneos

      - name: Verify IPA structure
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          unzip -q packages/NullSign-unsigned.ipa -d "$workdir"
          plist_count="$(find "$workdir/Payload" -mindepth 2 -maxdepth 2 -type f -path '*.app/Info.plist' | wc -l | tr -d ' ')"
          test "$plist_count" -eq 1
          plist_path="$(find "$workdir/Payload" -mindepth 2 -maxdepth 2 -type f -path '*.app/Info.plist')"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path"

      - name: Upload NullSign IPA
        uses: actions/upload-artifact@v4
        with:
          name: NullSign-unsigned-IPA
          path: packages/NullSign-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
