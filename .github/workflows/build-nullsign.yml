name: Build NullSign IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned NullSign IPA
        run: make iphoneos

      - name: Upload NullSign IPA
        uses: actions/upload-artifact@v4
        with:
          name: NullSign-unsigned-IPA
          path: packages/NullSign-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
